name: Deploy feature

on:
  push:
    branches:
      - "feature/**"

concurrency:
  group: merge-feature-develop
  cancel-in-progress: false

jobs:
  get-current-branch:
    name: Obter nome da branch feature/**
    runs-on: ubuntu-latest

    outputs:
      current-branch: ${{ steps.vars.outputs.BRANCH }}

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Obter nome da branch atual
        id: vars
        run: echo "BRANCH=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

      - name: Mostrar nome da branch
        run: |
          echo "Branch atual: ${{ steps.vars.outputs.BRANCH }}"
      
      - name: Debug output
        run: |
          echo "GITHUB_REF=$GITHUB_REF"
          echo "BRANCH=${{ steps.vars.outputs.BRANCH }}"

  call-tests-backend-workflow:
    needs: [get-current-branch]
    uses: edcaetanoguedes/manager-tasks-automated-tests/.github/workflows/automated-tests-backend.yml@main
    secrets:
      GH_MANAGER_TASKS_TESTS_TOKEN: ${{ secrets.GH_MANAGER_TASKS_TESTS_TOKEN }}
    with:
      current-branch: ${{ needs.get-current-branch.outputs.current-branch }}

  merge-feature-to-develop:
    name: Merge feature para develop
    needs: [get-current-branch, call-tests-backend-workflow]
    runs-on: ubuntu-latest
    if: success()

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout backend repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Definir branch
        run: |
          echo "BRANCH=${{ needs.get-current-branch.outputs.current-branch }}"
          echo "BRANCH=${{ needs.get-current-branch.outputs.current-branch }}" >> $GITHUB_ENV

      - name: Validar branch
        run: |
          if [ -z "$BRANCH" ]; then
            echo "ERRO: Branch não encontrada."
            exit 1
          fi

          echo "Branch recebida: $BRANCH"

      - name: Validar existência da branch remota
        run: |
          if ! git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            echo "Branch não encontrada: $BRANCH"
            exit 1
          fi
      
      - name: Debug merge
        run: |
          echo "BRANCH=[$BRANCH]"
          env | grep BRANCH || true

      - name: Merge feature para develop
        run: |
          echo "Feature: $BRANCH"
          echo "Target: develop"

          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "GitHub Actions"

          git fetch --all

          git checkout develop
          git fetch origin develop
          git reset --hard origin/develop

          git merge "$BRANCH" \
            --no-ff \
            -m "Auto-merge $BRANCH into develop [skip ci]"

          git push origin develop

          if git ls-remote --heads origin "$BRANCH" | grep -q "$BRANCH"; then
            git push origin --delete "$BRANCH"
          fi
